# >>>>> bsrnn_ecapa_FiLM.yaml 을 defaults 로 상속하고 키 하나만 바꾼 판 (#85).
#       2026-09-23 에 전문 복사본(118줄)에서 상속형으로 바꿈 — 합성 결과는 비트 동일(실측).
#       복사본이 아니므로 bsrnn_ecapa_FiLM.yaml 을 고치면 이 파일도 같이 따라감.
#
#       defaults 는 wesep/utils/utils.py 의 load_config_with_base() 가 hydra 의 Compose API
#       로 합성함. 이름은 확장자 없이 적고 같은 폴더의 yaml 을 가리킴.
#       `- _self_` 가 마지막이라 이 파일의 키가 부모를 덮어씀 — 순서를 뒤집으면 반대가 됨.
#
#       exp_dir 은 exp/bsrnn_ecapa_FiLM-16-spkeval 처럼 -spkeval 을 붙여 기존 run 을 덮지 말 것
#       (run.sh 가 --exp_dir 를 CLI 로 넘겨 yaml 값을 덮고, stage 3 은 그 폴더의
#        latest_checkpoint.pt 를 무조건 이어받음).
#       근거는 SD-FiLM 저장소의 docs/issues/wesep_frozen_encoder_bn_drift.md

defaults:
  - bsrnn_ecapa_FiLM
  - _self_

model_args:
  tse_model:
    spk_model_eval: True       # >>>>> 동결 인코더를 학습 중에도 eval 로 둬 BatchNorm 통계까지 얼림 (#85).
                               #       기본값 False 인 bsrnn_ecapa_FiLM.yaml 로 돈 exp/ 4 run 과는
                               #       조건이 갈려 같은 표에 넣을 수 없음.
